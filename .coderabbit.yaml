# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Shared CodeRabbit configuration for austyle-io repositories.
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    # Manual trigger only: comment `@coderabbitai review` (or `full review`) on a PR.
    enabled: false
    auto_incremental_review: false
    drafts: false
    base_branches:
      - main
chat:
  auto_reply: true
