# Dependabot configuration for automated dependency updates
# Follows the austyle-io org policy (austyle-io/.github templates/dependabot.yml.md).
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # GitHub Actions - Keep workflow actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5
    # Minor and patch updates in one PR; majors stay ungrouped for human review
    groups:
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

# Note: Homebrew dependencies (Brewfile) are not currently supported by
# Dependabot. Use 'brew update && brew outdated' manually instead.
